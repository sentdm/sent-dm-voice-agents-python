[project]
name = "sentdm-voice-agents"
version = "0.1.1" # x-release-please-version
description = "Sent Voice Agents for Python: an AI agent that takes and places phone calls through Sent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Sent", email = "support@sent.dm" }]
keywords = ["sent", "voice", "agents", "calls", "websocket"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
  "Typing :: Typed",
]
dependencies = ["websockets>=13"]

[project.urls]
Homepage = "https://docs.sent.dm"
Repository = "https://github.com/sentdm/sent-dm-voice-agents-python"
Protocol = "https://github.com/sentdm/sent-dm-voice-protocol"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentdm_voice_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
