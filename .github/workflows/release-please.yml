name: Release Please
on:
  push:
    branches:
      - main
  # By hand too: after a tag or release is fixed outside release-please, a run
  # re-reads the releases without waiting for the next merge.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'sentdm/sent-dm-voice-agents-python'
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.SDK_APP_ID != '' && secrets.SDK_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint the release token from the GitHub App
        # A tag or release created with the built-in token starts no
        # workflow; the App's token does, and never expires on a calendar.
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v3.3.0
        with:
          app-id: ${{ secrets.SDK_APP_ID }}
          private-key: ${{ secrets.SDK_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app.outputs.token || github.token }}
